<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Twitch Commands</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #0e0e10; color: #efeff1; }
        h1 { color: #9146ff; }
        .command { background: #18181b; padding: 10px 15px; margin: 10px 0; border-radius: 5px; border-left: 4px solid #9146ff; }
        code { color: #bf94ff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Twitch Chat Commands</h1>
    <div class="command"><code>!discord</code> - Get an invite link to our community discord server.</div>
    <div class="command"><code>!socials</code> - Check out my Twitter, YouTube, and Instagram links.</div>
    <div class="command"><code>!lurk</code> - Let chat know you are hanging out quietly in the background.</div>
</body>
</html>
